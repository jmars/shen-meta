name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libgc-dev

      - name: Build
        run: make

      - name: Test (built-in)
        run: make test

  self-hosting:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgc-dev libncurses-dev libx11-dev

      - name: Build C VM
        run: make

      - name: Clone shen-scheme
        run: git clone --depth 1 https://github.com/tizoc/shen-scheme.git shen-scheme

      - name: Build shen-scheme
        run: make -C shen-scheme

      - name: Bundle
        run: make bundle SHEN=shen-scheme/_build/bin/shen-scheme

      - name: Test (self-hosting)
        run: timeout 120 make run-bundle
        continue-on-error: true
