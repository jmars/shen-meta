name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build
        run: make

      - name: Test (built-in)
        run: make test

  self-hosting:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build C VM
        run: make

      - name: Clone shen-scheme
        run: make setup

      - name: Build shen-scheme
        run: cd ../shen-scheme && make

      - name: Bundle
        run: make bundle

      - name: Test (self-hosting)
        run: make run-bundle
        continue-on-error: true
